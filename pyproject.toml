[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cron-lens"
version = "0.1.0"
description = "Inspect, validate, explain, and simulate 5-field cron expressions with zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cron-lens contributors" }]
keywords = ["cron", "crontab", "cli", "schedule", "devops", "parser", "simulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
cron-lens = "cron_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cron_lens"]
